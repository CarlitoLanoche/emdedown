<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://file.emdedown; img-src * data: blob:; style-src 'self' 'unsafe-inline' https://file.emdedown; font-src 'self' data:; script-src 'self'; connect-src 'self' https://file.emdedown; media-src 'self' https://file.emdedown; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emdedown</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="mode-preview">
  <header id="toolbar">
    <button class="icon-btn" id="btn-sidebar" title="Toggle sidebar (Ctrl+\)"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z M9 5v14" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="icon-btn" id="btn-open" title="Open file (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 18V6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h7.5A1.5 1.5 0 0 1 20 8.5V10 M3 18l2.4-6.6A1.5 1.5 0 0 1 6.8 10.4H21l-2.6 7.1a1.5 1.5 0 0 1-1.4 1H4.4A1.4 1.4 0 0 1 3 18z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
    <button class="icon-btn" id="btn-save" title="Save (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 4h11.2L20 7.8V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z M8 4v4.5h7V4 M7.5 20v-6h9v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
    <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5 M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5 M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="tb-sep"></span>
    <div id="tabs-wrap"><div id="tabs" role="tablist"></div><div id="tabs-track" hidden><div id="tabs-thumb"></div></div></div>
    <button class="icon-btn" id="btn-new" title="New document (Ctrl+N)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    <div class="spacer"></div>
    <div id="format-bar" hidden>
      <button class="icon-btn" data-fmt="bold" title="Bold (Ctrl+B)"><svg viewBox="0 0 24 24"><path d="M7 4.5h6a3.75 3.75 0 0 1 0 7.5H7z M7 12h7a3.75 3.75 0 0 1 0 7.5H7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" data-fmt="italic" title="Italic (Ctrl+I)"><svg viewBox="0 0 24 24"><path d="M10 4.5h8 M6 19.5h8 M14.5 4.5l-5 15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
      <button class="icon-btn fmt-extra" data-fmt="strike" title="Strikethrough (Ctrl+Shift+X)"><svg viewBox="0 0 24 24"><path d="M4 12h16 M16.5 7.2C15.8 5.6 14.1 4.5 12 4.5c-2.8 0-4.5 1.5-4.5 3.5 0 1.3.8 2.3 2.2 3 M8 16.5c.6 1.8 2.4 3 4.6 3 2.7 0 4.4-1.5 4.4-3.6 0-.8-.3-1.5-.8-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" data-fmt="heading" title="Heading"><svg viewBox="0 0 24 24"><path d="M6 4.5v15 M18 4.5v15 M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="icon-btn fmt-extra" data-fmt="code" title="Inline code (Ctrl+`)"><svg viewBox="0 0 24 24"><path d="M8.5 7 3.5 12l5 5 M15.5 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" data-fmt="link" title="Link (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <span class="tb-sep fmt-extra"></span>
      <button class="icon-btn" data-fmt="bullet" title="Bulleted list (Ctrl+Shift+8)"><svg viewBox="0 0 24 24"><path d="M10 6.5h10 M10 12h10 M10 17.5h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="5" cy="6.5" r="1.4" fill="currentColor"/><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="5" cy="17.5" r="1.4" fill="currentColor"/></svg></button>
      <button class="icon-btn" data-fmt="numbered" title="Numbered list (Ctrl+Shift+7)"><svg viewBox="0 0 24 24"><path d="M10 6.5h10 M10 12h10 M10 17.5h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 5l1.3-.8V9 M3.6 13.2c.3-.7 1-1 1.6-.9.8.1 1.1 1 .6 1.6L3.7 16h2.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" data-fmt="check" title="Checklist (Ctrl+Shift+C)"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="6" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.9 7.6l1.3 1.3 2.3-2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="13.5" width="6" height="6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 7.5h7.5 M13 16.5h7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="icon-btn fmt-extra" data-fmt="quote" title="Quote (Ctrl+Shift+.)"><svg viewBox="0 0 24 24"><path d="M5 5v14 M9.5 7.5h10 M9.5 12h10 M9.5 16.5h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <span class="tb-sep fmt-extra"></span>
      <button class="icon-btn fmt-extra" data-fmt="image" title="Insert image…"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10" r="1.7" fill="currentColor"/><path d="M4 17.5l5-4.5 3.5 3 3-2.5 4.5 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn fmt-extra" data-fmt="table" title="Insert table"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 9.5h17 M3.5 14.5h17 M9.5 4.5v15 M15 4.5v15" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <span class="tb-sep"></span>
    </div>
    <button class="icon-btn" id="btn-sync" title="Sync scrolling between editor and preview" hidden><svg viewBox="0 0 24 24"><path d="M7 4v16 M17 4v16 M4 8l3-4 3 4 M14 16l3 4 3-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="segmented" id="mode-switch" title="View mode (Ctrl+E)">
      <button data-mode="preview">Read</button>
      <button data-mode="split">Split</button>
      <button data-mode="edit">Edit</button>
    </div>
    <button class="icon-btn" id="btn-theme" title="Toggle light/dark (Ctrl+Shift+L)"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg></button>
    <button class="icon-btn" id="btn-palette" title="All commands (Ctrl+Shift+P)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
    <button class="icon-btn" id="btn-settings" title="Settings (Ctrl+,)"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54a7.03 7.03 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.67 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.43 7.43 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
  </header>
  <div id="main">
    <aside id="sidebar">
      <nav id="side-tabs">
        <button data-panel="files" title="Files (Ctrl+Shift+E)">Files</button>
        <button data-panel="outline" title="Outline">Outline</button>
        <button data-panel="search" title="Search in folder (Ctrl+Shift+F)">Search</button>
      </nav>
      <section class="panel" id="panel-files">
        <div class="panel-head"><span id="folder-name">No folder</span>
          <button class="icon-btn small" id="btn-open-folder" title="Open folder"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v10H3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
          <button class="icon-btn small" id="btn-close-folder" title="Close folder" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
          <button class="icon-btn small" id="btn-refresh" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        </div>
        <input id="file-filter" class="field" placeholder="Filter files…" spellcheck="false">
        <div id="file-tree" class="tree"></div>
      </section>
      <section class="panel" id="panel-outline"><div id="outline"></div></section>
      <section class="panel" id="panel-search">
        <input id="search-input" class="field" placeholder="Search all files in folder…" spellcheck="false">
        <label class="check"><input type="checkbox" id="search-case"> Match case</label>
        <div id="search-results"></div>
      </section>
      <div id="sidebar-resizer"></div>
    </aside>
    <section id="workspace">
      <div id="banner" hidden></div>
      <div id="panes">
        <div id="editor-pane"></div>
        <div id="split-resizer"></div>
        <div id="preview-pane" tabindex="-1">
          <div id="progress"></div>
          <div id="docs"></div>
          <div id="start" hidden></div>
        </div>
      </div>
      <div id="findbar" hidden>
        <input id="find-input" placeholder="Find in document" spellcheck="false">
        <span id="find-count"></span>
        <button class="icon-btn small" id="find-prev" title="Previous (Shift+Enter)">&#x2191;</button>
        <button class="icon-btn small" id="find-next" title="Next (Enter)">&#x2193;</button>
        <button class="icon-btn small" id="find-close" title="Close (Esc)">&#x2715;</button>
      </div>
    </section>
  </div>
  <footer id="statusbar">
    <span id="st-path" class="clickable" title="Show in Explorer"></span>
    <span class="spacer"></span>
    <span id="st-cursor"></span>
    <span id="st-words"></span>
    <span id="st-eol"></span>
    <span id="st-zoom" class="clickable" title="Reset text size (Ctrl+0)"></span>
  </footer>
</div>

<div id="palette" class="overlay" hidden>
  <div class="palette-box">
    <input id="palette-input" spellcheck="false" autocomplete="off">
    <div id="palette-list"></div>
  </div>
</div>
<div id="modal" class="overlay" hidden><div class="modal-box" id="modal-box"></div></div>
<div id="lightbox" class="overlay" hidden><img alt=""></div>
<div id="slides" hidden><div id="slide-stage"><div id="slide"></div></div><div id="slide-count"></div></div>
<div id="toast" hidden></div>
<div id="menu" class="ctx-menu" role="menu" hidden></div>
<div id="tip" role="tooltip" hidden></div>
<div id="dropzone" hidden><div>Drop to open</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
